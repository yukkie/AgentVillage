repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        exclude: ^frontend/
      - id: frontend-test
        name: frontend test
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]
      - id: frontend-coverage
        name: frontend coverage
        entry: npm --prefix frontend run test:coverage
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]
